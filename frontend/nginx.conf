server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxied to the backend container over the internal Docker network —
    # keeps this container self-contained and testable on its own port
    # (e.g. directly via IP:4012), not dependent on Caddy being configured.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Reveal endpoints call an external webhook and write many rows
        # before responding at all — default 60s read timeout causes a
        # premature 504 while the backend keeps running and finishes anyway.
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Version-stamped Chrome extension builds. The explicit =404 matters:
    # without it the SPA fallback below would answer a missing or renamed zip
    # with index.html, so the browser saves 200 OK HTML as a ".zip" and Chrome
    # rejects it with a confusing "manifest file is missing or unreadable".
    # Caching immutably is safe only because the filename carries the version.
    location /extension/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Covers people who paste the URL directly; in-app clicks already get
        # this from the anchor's download attribute.
        add_header Content-Disposition "attachment";
    }

    # React Router client-side routes (e.g. /lists/:id) — fall back to
    # index.html instead of a raw 404 from Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
